[project]
name = "vizor-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "supabase>=2.9",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "openai>=1.54",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "trafilatura>=1.12",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
